name: build-release

# 私有内核仓产线（DESIGN §16.4：壳已剥离至公开仓 dsh-supervisor-launcher，本仓只管内核）。
# tag v<内核版本> → 构建 SEA + npm 子包发布；壳构建仅保留本地集成冒烟，不出 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: win-x64
          - os: macos-latest
            artifact: darwin-arm64
          - os: macos-13        # Intel Mac → darwin-x64（无交叉编译，需真机 runner）
            artifact: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain（仅壳集成冒烟用）
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 版本自洽校验（内核单源 + 壳两处互锁）
        shell: bash
        run: npm run verify:versions

      - name: Assemble shell frontend (required by generate_context)
        shell: bash
        run: bash scripts/build-shell-frontend.sh
      - name: Install Linux system deps (Tauri v2)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: 壳集成冒烟（cargo build + --node-plan，不发布）
        shell: bash
        run: |
          cargo build 2>&1 | tail -20
          ./target/debug/dsh-supervisor-gui --node-plan || true
        working-directory: src-tauri

      - name: npm test（内核回归）
        shell: bash
        run: npm test

      # ---- 内核 SEA 构建物（版本=单源注入，self-check 冒烟自带） ----
      - name: 构建内核 SEA（build:sea）
        shell: bash
        run: npm run build:sea

      - name: 内核子包 dry-run（组装 + 打包审计，不发）
        shell: bash
        run: |
          npm run publish:core -s
          ls -lh dist/npm/

      # ---- 真发布：仅 tag 触发 + 仓库 Secrets.NPM_TOKEN（需 npm 官方登录授权） ----
      - name: 发布内核子包（tag 触发，需 NPM_TOKEN）
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set //registry.npmjs.org/:_authToken="$NPM_TOKEN"
          npm run publish:core -- --publish

      - name: Upload artifacts（仅内核 SEA）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/sea/*.bin
            dist/sea/*.zip
            dist/sea/*.sha256
            dist/sea/README.md

      - name: Attach to GitHub Release（仅内核 SEA）
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sea/*
          generate_release_notes: true

  # ---- 前端门禁（Phase 2：一源双出口的 verify；独立 job 单平台跑一次，避免矩阵重复）----
  ui-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 前端 verify（typecheck/lint/test/build）
        shell: bash
        run: |
          cd ui
          npm ci
          npm run verify

      - name: 构建 UI 发布镜像（build-ui.sh → ui-react/）
        shell: bash
        run: |
          bash scripts/build-ui.sh --skip-install
          test -f ui-react/supervisor.html